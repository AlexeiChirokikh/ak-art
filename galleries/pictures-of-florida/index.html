        <h1>Pictures of Florida</h1>
      </div>
    </header>
    <div class="collection-grid"><figure class="collection-work">
          <a class="work-preview" href="../../assets/collections/pictures-of-florida/preview/01.jpg" data-preview="../../assets/collections/pictures-of-florida/preview/01.jpg" data-work-label="Everglades" aria-label="View Everglades">
            <img src="../../assets/collections/pictures-of-florida/thumb/01.jpg" alt="Everglades" loading="lazy" decoding="async">
            <span class="open-icon"><i data-lucide="maximize-2" aria-hidden="true"></i></span>
          </a>
          <figcaption><h2>Everglades</h2>
            <div class="artwork-description">
              <p>This place enchants me with the beauty of its greens, but it is also where fear makes me uneasy. The dark waters of the swamps, the countless alligators, and the mosquitoes make me think of Florida&#x27;s Indigenous people, who were driven from their fertile lands into the cold, damp swamp jungles. These resilient warriors refused to submit, survived, and made these impenetrable places their home and their protection.</p>
            </div>
            <a class="original-link" href="../../assets/collections/pictures-of-florida/original/Everglades.jpg" download="Everglades.jpg"
              aria-label="Download original image: Everglades"><i data-lucide="download" aria-hidden="true"></i><span>Download original</span></a>
          </figcaption>
        </figure><figure class="collection-work">
          <a class="work-preview" href="../../assets/collections/pictures-of-florida/preview/02.jpg" data-preview="../../assets/collections/pictures-of-florida/preview/02.jpg" data-work-label="Hurricane" aria-label="View Hurricane">
            <img src="../../assets/collections/pictures-of-florida/thumb/02.jpg" alt="Hurricane" loading="lazy" decoding="async">
            <span class="open-icon"><i data-lucide="maximize-2" aria-hidden="true"></i></span>
          </a>
          <figcaption><h2>Hurricane</h2>
            <div class="artwork-description">
              <p>Florida is beautiful with its beaches, ocean, and lush greenery. Yet the anticipation of an approaching hurricane changes our very sense of land as a place of stability, and a sunny paradise becomes a threat to life.</p>
              <p>A hurricane cannot make Florida less appealing or destroy our love for the beautiful peninsula of flowers, but it reminds us that nature is more powerful than we are and that we need to stay strong, ready at any moment to fight.</p>
            </div>
            <a class="original-link" href="../../assets/collections/pictures-of-florida/original/Hurricane.jpg" download="Hurricane.jpg"
              aria-label="Download original image: Hurricane"><i data-lucide="download" aria-hidden="true"></i><span>Download original</span></a>
          </figcaption>
        </figure><figure class="collection-work">
          <a class="work-preview" href="../../assets/collections/pictures-of-florida/preview/03.jpg" data-preview="../../assets/collections/pictures-of-florida/preview/03.jpg" data-work-label="The Clarity of the Stream" aria-label="View The Clarity of the Stream">
            <img src="../../assets/collections/pictures-of-florida/thumb/03.jpg" alt="The Clarity of the Stream" loading="lazy" decoding="async">
            <span class="open-icon"><i data-lucide="maximize-2" aria-hidden="true"></i></span>
          </a>
          <figcaption><h2>The Clarity of the Stream</h2>
            <div class="artwork-description">
              <p>On the blue surface, raised circles catch the light, and pale bands recall Florida&#x27;s clear streams and lakes, where we seek relief from the heat on a hot day. Florida&#x27;s lakes beckon, but their coolness is as deceptive as a painted picture. If the water in a Florida lake is wet, there are alligators in it, and swimming is prohibited.</p>
            </div>
            <a class="original-link" href="../../assets/collections/pictures-of-florida/original/The%20clarity%20of%20the%20stream.jpg" download="The clarity of the stream.jpg"
              aria-label="Download original image: The Clarity of the Stream"><i data-lucide="download" aria-hidden="true"></i><span>Download original</span></a>
          </figcaption>
        </figure><figure class="collection-work">
          <a class="work-preview" href="../../assets/collections/pictures-of-florida/preview/04.jpg" data-preview="../../assets/collections/pictures-of-florida/preview/04.jpg" data-work-label="The Queen&#x27;s Gift" aria-label="View The Queen&#x27;s Gift">
            <img src="../../assets/collections/pictures-of-florida/thumb/04.jpg" alt="The Queen&#x27;s Gift" loading="lazy" decoding="async">
            <span class="open-icon"><i data-lucide="maximize-2" aria-hidden="true"></i></span>
          </a>
          <figcaption><h2>The Queen&#x27;s Gift</h2>
            <div class="artwork-description">
              <p>The white swan represents the anticipation of bright and pleasant moments in life. Swans were brought to Florida as a gift from Britain&#x27;s Queen Elizabeth II, who presented them to the city of Lakeland in 1957. The city is now unofficially known as Swan City, and swans are its main symbol.</p>
            </div>
            <a class="original-link" href="../../assets/collections/pictures-of-florida/original/The%20Queen%27s%20Gift.jpg" download="The Queen&#x27;s Gift.jpg"
              aria-label="Download original image: The Queen&#x27;s Gift"><i data-lucide="download" aria-hidden="true"></i><span>Download original</span></a>
          </figcaption>
        </figure><figure class="collection-work">
          <a class="work-preview" href="../../assets/collections/pictures-of-florida/preview/05.jpg" data-preview="../../assets/collections/pictures-of-florida/preview/05.jpg" data-work-label="When Will the Gardens Bloom?" aria-label="View When Will the Gardens Bloom?">
            <img src="../../assets/collections/pictures-of-florida/thumb/05.jpg" alt="When Will the Gardens Bloom?" loading="lazy" decoding="async">
            <span class="open-icon"><i data-lucide="maximize-2" aria-hidden="true"></i></span>
          </a>
          <figcaption><h2>When Will the Gardens Bloom?</h2>
            <div class="artwork-description">
              <p>Florida&#x27;s orange harvests are shrinking rapidly. Disease and urbanization are to blame. The painting raises the question of the disappearance of Florida&#x27;s orange groves, but also reflects the hope that a brave orange will break through the stones, sod, and asphalt to reach the sun again.</p>
              <p>The orange rises above the surface of the painting, and next to the dark sod it retains the brightness of a real fruit. Above it, cotton cord outlines Florida. The entire state fits inside the outline, yet the eye still returns to the orange.</p>
            </div>
            <a class="original-link" href="../../assets/collections/pictures-of-florida/original/When%20will%20the%20gardens%20bloom.jpg" download="When will the gardens bloom.jpg"
              aria-label="Download original image: When Will the Gardens Bloom?"><i data-lucide="download" aria-hidden="true"></i><span>Download original</span></a>
          </figcaption>
        </figure></div>
